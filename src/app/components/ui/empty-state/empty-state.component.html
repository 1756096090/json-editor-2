<div class="empty-state">
  @if (icon(); as name) {
    <span class="empty-state__icon" aria-hidden="true"><app-ui-icon [name]="name" [size]="32" /></span>
  }
  <p class="empty-state__title">{{ title() }}</p>
  @if (description()) {
    <p class="empty-state__desc">{{ description() }}</p>
  }
  <ng-content />
</div>
