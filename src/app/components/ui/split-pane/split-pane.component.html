<div
  #container
  [class]="containerClass()"
  role="group"
  [attr.aria-label]="'split.groupAria' | t"
>
  <div class="split-pane__panel split-pane__left" [style]="leftStyle()">
    <ng-content select="[split-start]" />
  </div>

  <div
    class="split-pane__gutter"
    [style.width.px]="direction() === 'horizontal' ? gutterSize() : null"
    [style.height.px]="direction() === 'vertical' ? gutterSize() : null"
    [class.split-pane__gutter--hidden]="hideEnd()"
    role="separator"
    [attr.aria-orientation]="direction()"
    [attr.aria-valuenow]="ratio()"
    aria-valuemin="20"
    aria-valuemax="80"
    tabindex="0"
    [attr.aria-label]="'split.gutterAria' | t"
    [appTooltip]="'split.gutterTooltip' | t"
    (pointerdown)="onGutterPointerDown($event)"
    (pointermove)="onGutterPointerMove($event)"
    (pointerup)="onGutterPointerUp($event)"
    (pointercancel)="onGutterPointerUp($event)"
    (lostpointercapture)="onGutterPointerUp($event)"
    (dblclick)="resetRatio()"
    (keydown)="onGutterKeydown($event)"
  >
    <div class="split-pane__gutter-dot"></div>
    <div class="split-pane__gutter-dot"></div>
    <div class="split-pane__gutter-dot"></div>
    <ng-content select="[split-gutter]" />
  </div>

  <div class="split-pane__panel split-pane__right" [style]="rightStyle()" [class.split-pane__panel--hidden]="hideEnd()">
    <ng-content select="[split-end]" />
  </div>
</div>
