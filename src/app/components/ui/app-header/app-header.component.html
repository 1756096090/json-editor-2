<header class="header">
  <div class="header__inner">

    <!-- Logo -->
    <a routerLink="/" class="header__logo" [attr.aria-label]="'header.homeAria' | t">
      <app-logo-mark class="header__logo-mark" />
      <span class="header__brand" aria-hidden="true">
        <span class="header__brand-json">JSON</span>
        <span class="header__brand-hunt">Hunt</span>
      </span>
    </a>

    <!-- Primary nav -->
    <nav class="header__nav" [attr.aria-label]="'header.mainNav' | t">
      <a
        routerLink="/workbench"
        routerLinkActive="header__nav-link--active"
        class="header__nav-link"
      >
        {{ 'header.workspace' | t }}
      </a>

      <!-- <span
        class="header__nav-link header__nav-link--disabled"
        aria-disabled="true"
        title="Editor — en desarrollo"
      >
        Editor
        <span class="header__nav-badge">en desarrollo</span>
      </span> -->

      <!-- Tools dropdown -->
      <div class="header__tools-wrapper">
        <button
          type="button"
          class="header__nav-link header__nav-link--trigger"
          [class.header__nav-link--active]="toolsOpen()"
          data-tools-trigger
          [attr.aria-expanded]="toolsOpen()"
          aria-haspopup="true"
          aria-controls="tools-menu"
          (click)="toggleTools(); $event.stopPropagation()"
        >
          {{ 'header.tools' | t }}
          <svg class="header__chevron" [class.header__chevron--open]="toolsOpen()"
            width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        @if (toolsOpen()) {
          <div
            id="tools-menu"
            class="header__tools-menu"
            role="menu"
            [attr.aria-label]="'header.toolsMenu' | t"
          >
            @for (tool of tools; track tool.route) {
              <a
                [routerLink]="tool.route"
                class="header__tool-item"
                routerLinkActive="header__tool-item--active"
                role="menuitem"
                (click)="closeTools()"
              >
                <span class="header__tool-label">{{ tool.labelKey | t }}</span>
                @if (tool.badge) {
                  <span
                    class="header__tool-badge"
                    [class.header__tool-badge--new]="tool.badge === 'new'"
                  >{{ 'badge.new' | t }}</span>
                }
              </a>
            }
            <div class="header__tools-footer">
              <a routerLink="/" class="header__tools-all" (click)="closeTools()">
                {{ 'header.viewAllTools' | t }}
              </a>
            </div>
          </div>
        }
      </div>
    </nav>

    <!-- Meta actions -->
    <div class="header__actions">
      <button
        type="button"
        class="header__icon-btn"
        [attr.aria-label]="'header.settings' | t"
        [title]="'header.settings' | t"
        aria-haspopup="dialog"
        (click)="openSettings()"
      >
        <app-ui-icon name="settings" [size]="18" />
      </button>
      <button
        type="button"
        class="header__icon-btn"
        [attr.aria-label]="(isDark() ? 'header.toLight' : 'header.toDark') | t"
        [title]="(isDark() ? 'header.toLight' : 'header.toDark') | t"
        (click)="toggleTheme()"
      >
        @if (isDark()) {
          <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>

  </div>
</header>

@if (settingsOpen()) {
  <app-settings-panel (closed)="closeSettings()" />
}
