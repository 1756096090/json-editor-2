<main class="editor-lab" aria-label="Basic JSON editor">

  <section class="editor-lab__content">
    <app-split-pane direction="horizontal" [storageKey]="getSplitStorageKey()" (ratioChange)="splitRatio.set($event)">
      <app-editor-lab-pane
        split-start
        title="Doc"
        [ariaLabel]="inputFormat() + ' editor'"
        [value]="inputText()"
        [active]="activePane() === 'input'"
        [errorMessage]="inputError()"
        [diffDecorations]="inputDiffDecorations()"
        [colorRules]="inputColorRules()"
        [formatItems]="formatItems"
        [selectedFormatValue]="inputFormat()"
        [versions]="inputVersions()"
        [selectedVersionIndex]="inputSelectedVersion()"
        (valueChange)="onInput($event)"
        (focused)="setActivePane('input')"
        (saveVersionRequested)="saveInputVersion()"
        (versionSelected)="selectInputVersion($event)"
        (removeVersionRequested)="removeInputVersion($event)"
        (formatRequested)="formatPane('input')"
        (minifyRequested)="minifyPane('input')"
        (clearRequested)="clearPane('input')"
        (formatChange)="onFormatChange('input', $event)"
      />

      <app-editor-lab-pane
        split-end
        title="Doc"
        [ariaLabel]="outputFormat() + ' editor'"
        [value]="outputText()"
        [active]="activePane() === 'output'"
        [errorMessage]="outputError()"
        [diffDecorations]="outputDiffDecorations()"
        [colorRules]="outputColorRules()"
        [formatItems]="formatItems"
        [selectedFormatValue]="outputFormat()"
        [versions]="outputVersions()"
        [selectedVersionIndex]="outputSelectedVersion()"
        (valueChange)="onOutput($event)"
        (focused)="setActivePane('output')"
        (saveVersionRequested)="saveOutputVersion()"
        (versionSelected)="selectOutputVersion($event)"
        (removeVersionRequested)="removeOutputVersion($event)"
        (formatRequested)="formatPane('output')"
        (minifyRequested)="minifyPane('output')"
        (clearRequested)="clearPane('output')"
        (formatChange)="onFormatChange('output', $event)"
      />

      <div split-gutter class="editor-lab__transfer" role="group" aria-label="Transfer actions">
        <label class="editor-lab__compare-toggle" [title]="compareButtonTitle()">
          <input
            type="checkbox"
            class="editor-lab__compare-checkbox"
            [checked]="compareEnabled()"
            (change)="onCompareToggle($any($event.target).checked)"
            aria-label="Compare current editors"
          />
          <span>Compare</span>
        </label>

        <button
          type="button"
          class="editor-lab__transfer-btn"
          [disabled]="!inputText().trim()"
          (click)="copyInputToOutput()"
          aria-label="Copy editor A to editor B"
          title="Copy A to B"
        >→</button>
        <button
          type="button"
          class="editor-lab__transfer-btn"
          [disabled]="!outputText().trim()"
          (click)="copyOutputToInput()"
          aria-label="Copy editor B to editor A"
          title="Copy B to A"
        >←</button>
        <button
          type="button"
          class="editor-lab__transfer-btn"
          [disabled]="!inputText().trim() && !outputText().trim()"
          (click)="swapPanels()"
          aria-label="Swap editors"
          title="Swap editors"
        >⇅</button>
      </div>
    </app-split-pane>
  </section>
</main>
