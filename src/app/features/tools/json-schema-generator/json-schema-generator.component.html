<div class="tool-page">
  <app-tool-intro [title]="'tools.schemaGen.title' | t">
    <span slot="subtitle">{{ 'tools.schemaGen.subtitle' | t }}</span>
    <div slot="actions" class="tool-page__actions">
      <button
        type="button"
        class="tool-page__action-btn"
        (click)="onGenerate()"
        [disabled]="!store.isValidJson()"
      >
        <app-ui-icon name="wand" [size]="16" />
        {{ 'tools.schemaGen.button' | t }}
      </button>
      <span class="tool-page__action-status" aria-live="polite">
        @if (!store.isValidJson()) {
          {{ 'tools.schemaGen.needsJson' | t }}
        } @else {
          {{ lastStatus() }}
        }
      </span>
    </div>
  </app-tool-intro>

  <app-json-workbench />
</div>
