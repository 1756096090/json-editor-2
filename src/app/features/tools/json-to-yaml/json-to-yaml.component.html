<div class="tool-page">
  <div class="tool-page__intro">
    <h1 class="tool-page__title">{{ 'yaml.title' | t }}</h1>
    <p class="tool-page__subtitle">{{ 'yaml.subtitle' | t }}</p>
  </div>

  <div class="yaml-workspace">
    <!-- Toolbar -->
    <div class="yaml-toolbar" role="toolbar" [attr.aria-label]="'yaml.actionsAria' | t">
      <app-ui-button size="sm" variant="accent" (pressed)="convert()">
        {{ 'yaml.convert' | t }}
      </app-ui-button>

      <div class="yaml-toolbar__sep" aria-hidden="true"></div>

      <app-ui-button
        size="sm"
        variant="ghost"
        [disabled]="!yamlOutput()"
        (pressed)="copyYaml()"
      >{{ 'yaml.copy' | t }}</app-ui-button>

      <app-ui-button
        size="sm"
        variant="ghost"
        [disabled]="!yamlOutput()"
        (pressed)="downloadYaml()"
      >{{ 'yaml.download' | t }}</app-ui-button>

      @if (errorMsg()) {
        <span class="yaml-toolbar__error" role="alert">{{ errorMsg() }}</span>
      } @else if (status()) {
        <span class="yaml-toolbar__status" aria-live="polite">{{ status() }}</span>
      }
    </div>

    <!-- Panels -->
    <div class="yaml-panels">
      <!-- Left: JSON input -->
      <div class="yaml-panel">
        <div class="yaml-panel__header">
          <h2 class="yaml-panel__title">{{ 'yaml.input' | t }}</h2>
        </div>
        <div class="yaml-panel__body">
          <app-editor-text
            language="json"
            [value]="jsonInput()"
            [theme]="monacoTheme()"
            [ariaLabel]="'yaml.inputAria' | t"
            (valueChange)="onJsonChange($event)"
          />
        </div>
      </div>

      <!-- Right: YAML output (read-only) -->
      <div class="yaml-panel">
        <div class="yaml-panel__header">
          <h2 class="yaml-panel__title">{{ 'yaml.output' | t }}</h2>
        </div>
        <div class="yaml-panel__body">
          <app-editor-text
            language="yaml"
            [value]="yamlOutput()"
            [readOnly]="true"
            [theme]="monacoTheme()"
            [ariaLabel]="'yaml.outputAria' | t"
          />
        </div>
      </div>
    </div>
  </div>
</div>
