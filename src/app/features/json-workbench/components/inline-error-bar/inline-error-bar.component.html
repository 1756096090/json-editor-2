<div class="error-bar" role="alert" aria-live="assertive">
  <span class="error-bar__icon" aria-hidden="true"><app-ui-icon name="warning" [size]="16" /></span>
  <span class="error-bar__message">
    <strong>{{ 'error.invalidJson' | t }}</strong>
    {{ error().message }}
    <span class="error-bar__pos">
      {{ 'error.position' | t: { line: error().line, column: error().column } }}
    </span>
  </span>
  <div class="error-bar__actions">
    <button
      type="button"
      class="error-bar__btn error-bar__btn--show"
      [appTooltip]="'error.showTooltip' | t"
      [attr.aria-label]="'error.showAria' | t"
      (click)="showMe.emit()"
    >
      {{ 'error.show' | t }}
    </button>
    @if (autoFixEnabled()) {
      <button
        type="button"
        class="error-bar__btn error-bar__btn--repair"
        [appTooltip]="'error.repairTooltip' | t"
        [attr.aria-label]="'error.repairAria' | t"
        (click)="autoRepair.emit()"
      >
        {{ 'error.repair' | t }}
      </button>
    }
  </div>
</div>
