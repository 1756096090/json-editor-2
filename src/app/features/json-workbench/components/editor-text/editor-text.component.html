<div #editorContainer class="editor-text-container"></div>

@if (caseToolEnabled() && getSelectionToolbarPosition(); as position) {
  <div
    class="editor-text-selection-tools"
    [style.left.px]="position.left"
    [style.top.px]="position.top"
    role="toolbar"
    [attr.aria-label]="'case.toolbarAria' | t"
  >
    <span class="editor-text-selection-tools__label" aria-hidden="true">Aa</span>
    <select
      class="editor-text-selection-tools__select"
      [attr.aria-label]="'case.selectAria' | t"
      (change)="onCaseTransformSelected($any($event.target).value); $any($event.target).value = ''"
    >
      <option value="">{{ 'case.placeholder' | t }}</option>
      @for (option of caseOptions(); track option.id) {
        <option [value]="option.id">{{ option.label }}</option>
      }
    </select>
    <span class="editor-text-selection-tools__chevron" aria-hidden="true">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </span>
  </div>
}
