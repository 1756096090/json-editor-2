<div class="diff-bar" role="toolbar" [attr.aria-label]="'diff.aria' | t">

  <!-- Stats -->
  <div class="diff-bar__stats" aria-live="polite" aria-atomic="true">
    @if (computing()) {
      <span class="diff-bar__computing" [attr.aria-label]="'diff.computing' | t">…</span>
    } @else {
      <span class="diff-bar__stat diff-bar__stat--added"
            [attr.aria-label]="'diff.addedAria' | t: { n: addedCount() }">
        {{ 'diff.added' | t: { n: addedCount() } }}
      </span>
      <span class="diff-bar__stat diff-bar__stat--removed"
            [attr.aria-label]="'diff.removedAria' | t: { n: removedCount() }">
        {{ 'diff.removed' | t: { n: removedCount() } }}
      </span>
    }
  </div>

  <span class="diff-bar__legend">{{ 'diff.legend' | t }}</span>

  <span class="diff-bar__sep" aria-hidden="true"></span>

  <!-- Navigation -->
  <div class="diff-bar__nav" role="group" [attr.aria-label]="'diff.navAria' | t">
    <app-ui-button
      size="sm"
      variant="ghost"
      [ariaLabel]="'diff.prevAria' | t"
      [tooltipText]="'diff.prevAria' | t"
      (pressed)="prevHunk.emit()"
    >{{ 'diff.prev' | t }}</app-ui-button>

    <span class="diff-bar__counter" aria-live="polite">{{ navLabel() }}</span>

    <app-ui-button
      size="sm"
      variant="ghost"
      [ariaLabel]="'diff.nextAria' | t"
      [tooltipText]="'diff.nextAria' | t"
      (pressed)="nextHunk.emit()"
    >{{ 'diff.next' | t }}</app-ui-button>
  </div>

  <span class="diff-bar__sep" aria-hidden="true"></span>

  <!-- Close diff -->
  <app-ui-button
    size="sm"
    variant="ghost"
    [ariaLabel]="'diff.closeAria' | t"
    [tooltipText]="'diff.closeTooltip' | t"
    (pressed)="closeDiff.emit()"
  >{{ 'diff.close' | t }}</app-ui-button>

</div>
