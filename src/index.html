<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON Hunt — Format, Validate &amp; Compare JSON</title>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description"
    content="JSON Hunt — the professional JSON workspace for developers. Format, validate, compare, minify and convert JSON. Fast, clean and distraction-free.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://jsonworkbench.dev/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="JSON Hunt — The professional JSON workspace">
  <meta property="og:description"
    content="Format, validate, compare and convert JSON. A full workspace and a curated suite of tools for developers.">
  <meta property="og:url" content="https://jsonworkbench.dev/">
  <meta property="og:image" content="https://jsonworkbench.dev/assets/og-image.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JSON Hunt — The professional JSON workspace">
  <meta name="twitter:description"
    content="Format, validate, compare and convert JSON. Fast, clean and distraction-free.">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#121923" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <link rel="icon" type="image/svg+xml" href="/assets/svgs/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Apply the saved theme before Angular boots so there is no flash of the wrong theme.
       Keep in sync with SettingsStore.applyTheme() and DARK_THEMES in core/themes/app-themes.ts. -->
  <script>
    (function () {
      var root = document.documentElement;
      var dark = ['visual-studio-dark', 'one-dark-pro', 'dracula', 'jetbrains-islands-dark'];
      var s = {};
      try { s = JSON.parse(localStorage.getItem('json-we-format:settings') || '{}') || {}; } catch (e) {}
      root.setAttribute('data-theme', s.themeMode === 'dark' ? 'dark' : 'light');
      root.setAttribute('data-dark-theme', dark.indexOf(s.darkTheme) >= 0 ? s.darkTheme : dark[0]);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
